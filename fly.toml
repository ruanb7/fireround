# Fireround, otto deployment. One machine, never stopped: the server runs its own hourly cron tick.
app = "fireround-otto"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # "::" binds dual-stack. Fly's proxy and health checks reach the machine over private IPv6,
  # so a 0.0.0.0 (IPv4-only) bind answers "connection refused" to both.
  HOSTNAME = "::"
  APP_ORIGIN = "https://fireround-otto.fly.dev"
  EDGAR_USER_AGENT = "fireround-otto/1.0 (ruan.botha.live@gmail.com)"
  DATABASE_DRIVER = "pg"
  DATABASE_POOL_MAX = "3"
  RECONCILE_PROVIDER = "openrouter"
  RECONCILE_MODEL = "openai/gpt-6-luna"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"
  method = "GET"
  # The only unauthenticated routes are static assets: /, /home, /robots.txt and /api/* answer 401
  # behind Basic auth once DASHBOARD_PASSWORD is set, and Fly counts a 401 as a failed check.
  # Verified from inside the machine on 2026-10-25: /favicon.ico and /opengraph-image return 200.
  path = "/favicon.ico"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
